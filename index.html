<style>
  :root {
    --page: #f8f8f8;
    --card: rgba(255, 255, 255, 0.8);

    --card-border: #ffffff;
    --text: rgb(21, 21, 21);
    --secondary: #757575;
    --tertiary: rgba(21, 21, 21, 0.36);
    --faint: rgba(21, 21, 21, 0.04);
    --line: rgba(21, 21, 21, 0.08);
    --switch-bg: rgba(21, 21, 21, 0.04);
    --switch-on: #ffffff;
    --tz: rgb(214, 151, 18);
    --orange: rgb(248, 113, 43);
    --green: rgb(60, 189, 44);
    --blue: rgb(20, 106, 235);
    --purple: rgb(125, 83, 230);
    --glow: linear-gradient(rgba(125, 83, 230, 0.2) 0%, rgba(57, 91, 242, 0.1) 50%, rgba(95, 121, 198, 0) 100%);
    --shadow-hover: 0 1px 4px rgba(0, 0, 0, 0.04), 0 4px 16px rgba(0, 0, 0, 0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #131517;
      --card: rgba(255, 255, 255, 0.04);
      --card-hover: rgba(255, 255, 255, 0.07);
      --card-border: rgba(255, 255, 255, 0.04);
      --text: rgba(255, 255, 255, 0.92);
      --secondary: rgba(255, 255, 255, 0.64);
      --tertiary: rgba(255, 255, 255, 0.4);
      --faint: rgba(255, 255, 255, 0.04);
      --line: rgba(255, 255, 255, 0.08);
      --switch-bg: rgba(255, 255, 255, 0.06);
      --switch-on: rgba(255, 255, 255, 0.12);
      --tz: rgb(240, 186, 64);
      --glow: linear-gradient(rgba(125, 83, 230, 0.28) 0%, rgba(57, 91, 242, 0.12) 50%, rgba(95, 121, 198, 0) 100%);
      --shadow-hover: none;
    }
  }
  * { box-sizing: border-box; }
  html { background: var(--page); }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Inter", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  .glow { position: fixed; inset: 0 0 auto 0; height: 180px; background: var(--glow); pointer-events: none; z-index: 0; }

  /* nav */
  nav.top {
    position: relative; z-index: 2;
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; font-size: 14px; font-weight: 500;
  }
  nav.top .brand { display: flex; align-items: center; gap: 8px; }
  nav.top .brand .logo { font-size: 20px; line-height: 1; }
  nav.top .right { display: flex; align-items: center; gap: 16px; color: var(--tertiary); }
  .btn-ghost {
    font: inherit; cursor: pointer; border: 0; color: var(--text);
    background: var(--switch-bg); border-radius: 8px; padding: 4px 10px; white-space: nowrap;
  }
  .btn-ghost:hover { background: var(--line); }

  .page { position: relative; z-index: 1; max-width: 820px; margin: 0 auto; padding: 20px 16px 80px; }

  /* header */
  .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 8px; }
  h1 { font-size: 28px; line-height: 1.2; font-weight: 600; margin: 0; }
  .sub { color: var(--tertiary); margin: 6px 0 28px; font-size: 15px; }
  .switcher { display: inline-flex; background: var(--switch-bg); border-radius: 16px; padding: 2px; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
  .switcher::-webkit-scrollbar { display: none; }
  .switcher button {
    font: inherit; font-size: 14px; font-weight: 500; line-height: 21px; cursor: pointer;
    border: 0; background: transparent; color: var(--tertiary);
    padding: 5px 10px; border-radius: 14px; white-space: nowrap; transition: background .15s, color .15s;
  }
  .switcher button[aria-pressed="true"] { background: var(--switch-on); color: var(--text); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06); }

  /* timeline */
  .timeline { position: relative; }
  .day { position: relative; display: grid; grid-template-columns: 144px 1fr; padding-bottom: 32px; }
  .day::before { content: ""; position: absolute; left: 116px; top: 10px; bottom: -10px; border-left: 2px dashed var(--line); }
  .day:last-child::before { bottom: 0; }
  .day-label { position: sticky; top: 16px; align-self: start; }
  .day-label::after { content: ""; position: absolute; left: 114px; top: 9px; width: 6px; height: 6px; border-radius: 50%; background: var(--tertiary); }
  .day-label .date { font-weight: 500; }
  .day-label .weekday { color: var(--tertiary); }
  .cards { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

  .card {
    position: relative; display: flex; gap: 16px;
    background: var(--card); border: 1px solid var(--card-border); border-radius: 16px;
    padding: 12px 12px 12px 16px;
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    transition: background .15s, box-shadow .15s;
  }
  .card:hover { background: var(--card-hover); box-shadow: var(--shadow-hover); }
  .card .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .time { color: var(--tertiary); }
  .time .tz { color: var(--tz); }
  .card h3 { font-size: 20px; line-height: 24px; font-weight: 500; margin: 0 0 4px; }
  .card h3 a::after { content: ""; position: absolute; inset: 0; border-radius: inherit; }
  .meta { display: flex; align-items: center; gap: 6px; color: var(--tertiary); font-size: 15px; line-height: 22px; min-width: 0; }
  .meta span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta svg { flex: none; }
  .foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .pill { font-size: 12px; font-weight: 500; line-height: 12px; color: #fff; padding: 4px 7px; border-radius: 4px; }
  .pill.open { background: var(--green); }
  .pill.approval { background: var(--orange); }
  .pill.full { background: var(--blue); }
  .pill.official { background: var(--purple); }
  .food {
    font-size: 12px; font-weight: 500; line-height: 12px; color: var(--secondary);
    background: var(--switch-bg); padding: 4px 7px; border-radius: 4px; white-space: nowrap;
  }
  .count { font-size: 13px; color: var(--tertiary); }
  .cal {
    position: relative; z-index: 2; margin-left: auto;
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 13px; color: var(--tertiary); padding: 2px 8px; border-radius: 8px;
  }
  .cal:hover { color: var(--text); background: var(--faint); }

  .cover {
    flex: none; width: 120px; height: 120px; border-radius: 12px; overflow: hidden;
    background: var(--faint); border: 1px solid var(--faint);
    display: grid; place-items: center; font-size: 44px;
  }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover.gen-1 { background: linear-gradient(135deg, #ffb36b, #f3527c); }
  .cover.gen-2 { background: linear-gradient(135deg, #8ec5ff, #7d53e6); }
  .cover.gen-3 { background: linear-gradient(135deg, #ffd27a, #ff8a5c); }

  /* side sections */
  .section-title { font-size: 20px; font-weight: 600; margin: 24px 0 12px; }
  .note-card {
    background: var(--card); border: 1px solid var(--card-border); border-radius: 16px;
    padding: 16px; margin-bottom: 12px; color: var(--secondary); font-size: 15px;
  }
  .note-card b { color: var(--text); font-weight: 500; }
  .note-card ul { margin: 0; padding-left: 18px; }
  .note-card li + li { margin-top: 8px; }
  .note-card a { color: var(--purple); }
  footer { color: var(--tertiary); font-size: 13px; margin-top: 32px; }
  .empty { color: var(--tertiary); padding: 40px 0; text-align: center; }

  @media (max-width: 640px) {
    .day { grid-template-columns: 1fr; padding-bottom: 24px; }
    .day::before, .day-label::after { display: none; }
    .day-label { position: sticky; top: 0; z-index: 3; background: var(--page); padding: 8px 0; margin-bottom: 4px; display: flex; gap: 8px; }
    .card { padding: 12px; gap: 12px; }
    .card h3 { font-size: 17px; line-height: 22px; }
    .cover { width: 80px; height: 80px; font-size: 32px; }
    .meta { font-size: 14px; align-items: flex-start; }
    .meta svg { margin-top: 3px; }
    .meta span { white-space: normal; }
    nav.top .clock, nav.top .brand .name { display: none; }
    nav.top .right { gap: 8px; }
  }
</style>
</head>

    tipsTitle: "赶场建议",
    tips: `<ul>

    footer: `<p>信息来自 corl.org、Luma 公开页面、X 和 LinkedIn 公开帖子；人数和名额为 2026-11-02 的快照，以各活动页面为准。Partiful、微信群等邀请制活动无法检索，实际活动会更多。非 CoRL 或 Luma 官方页面。</p>`,

// English by default; ?lang=zh (or the /zh/ shortcut) or a remembered choice switches to Chinese.
function initialLang() {
  const q = new URLSearchParams(location.search).get("lang");
  if (q === "en" || q === "zh") return q;
  try {
    const saved = localStorage.getItem("lang");
    if (saved === "en" || saved === "zh") return saved;
  } catch (err) {}
  return "en";
}
let lang = initialLang();
let filter = "all";
const t = () => T[lang];
const L = v => (v && typeof v === "object" ? v[lang] : v);

const CDN = "https://images.lumacdn.com/cdn-cgi/image/format=auto,fit=cover,dpr=2,background=white,quality=75,width=120,height=120/uploads/";

const ICON = {
  host: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
  pin: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>',
  cal: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18M12 14v4M10 16h4"/></svg>',
};

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function toDate(day, hm) {
  const [h, m] = hm.split(":").map(Number);
  return new Date(Date.UTC(2026, Number(day.slice(0, 2)) - 1, Number(day.slice(3)), h + 6, m));
}
const stamp = d => d.toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
const hm = (d, tz) => new Intl.DateTimeFormat("en-GB", { hour: "2-digit", minute: "2-digit", hour12: false, timeZone: tz }).format(d);

// Like Luma: viewer's local time first; if they're not on Austin time, add the event-local time in amber.
function timeLabel(e) {
  if (e.approx) return esc(t().approx);
  const d = toDate(e.day, e.start);
  const local = hm(d);
  const austin = hm(d, "America/Chicago");
  return local === austin ? esc(local) : `${esc(local)} · <span class="tz">GMT-6 ${esc(austin)}</span>`;
}

function gcalLink(e) {
  const p = new URLSearchParams({
    action: "TEMPLATE",
    text: L(e.title),
    dates: `${stamp(toDate(e.day, e.start))}/${stamp(toDate(e.day, e.end))}`,
    details: `${L(e.host)}\n${e.url}`,
    location: L(e.place),
  });
  return "https://calendar.google.com/calendar/render?" + p.toString();
}

function cover(e) {
  if (e.cover) return `<div class="cover"><img loading="lazy" alt="" src="${CDN}${e.cover}" onerror="this.remove()"></div>`;
  return `<div class="cover gen-${e.gen}">${e.emoji}</div>`;
}

function render() {
  const s = t();
  let html = "";
  for (const day of DAYS) {
    const items = EVENTS.filter(e => e.day === day && (filter === "all" || e.status === filter));
    if (!items.length) continue;
    const [mo, d] = day.split("-").map(Number);
    html += `<section class="day">
      <div class="day-label"><div class="date">${s.date(mo, d)}</div><div class="weekday">${s.weekday[day]}</div></div>
      <div class="cards">`;
    for (const e of items) {
      html += `<article class="card">
        <div class="body">
          <div class="time">${timeLabel(e)}</div>
          <h3><a href="${e.url}" target="_blank" rel="noopener">${esc(L(e.title))}</a></h3>
          <div class="meta">${ICON.host}<span>${esc(s.by(L(e.host), L(e.sponsor)))}</span></div>
          <div class="meta">${ICON.pin}<span>${esc(L(e.place))}</span></div>
          <div class="foot">
            <span class="pill ${e.status}">${s.label[e.status]}</span>
            ${e.food ? `<span class="food" title="${esc(s.foodTitle)}">${esc(L(e.food))}</span>` : ""}
            ${e.guests ? `<span class="count">${s.going(e.guests)}</span>` : ""}
            ${e.approx ? "" : `<a class="cal" href="${gcalLink(e)}" target="_blank" rel="noopener">${ICON.cal}${s.cal}</a>`}
          </div>
        </div>
        ${cover(e)}
      </article>`;
    }
    html += `</div></section>`;
  }
  document.getElementById("list").innerHTML = html || `<p class="empty">${esc(s.empty)}</p>`;
}

function applyLang() {
  const s = t();
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  document.title = s.pageTitle;
  document.querySelectorAll("[data-t]").forEach(el => { el.innerHTML = s[el.dataset.t]; });
  document.getElementById("filters").setAttribute("aria-label", s.filtersLabel);
  const btn = document.getElementById("lang");
  btn.textContent = s.langBtn;
  btn.lang = lang === "zh" ? "en" : "zh-CN";
  const count = st => EVENTS.filter(e => e.status === st).length;
  document.getElementById("sub").textContent = s.sub(
    { total: EVENTS.length, official: count("official"), open: count("open") });
  render();
}

document.getElementById("lang").addEventListener("click", () => {
  lang = lang === "en" ? "zh" : "en";
  try { localStorage.setItem("lang", lang); } catch (err) {}
  const url = new URL(location.href);
  url.searchParams.set("lang", lang);
  history.replaceState(null, "", url);
  applyLang();
});

function tick() {
  document.getElementById("clock").textContent = "Austin " + hm(new Date(), "America/Chicago");
}
tick();
setInterval(tick, 30000);

document.getElementById("ics").addEventListener("click", () => {
  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//corl2026-socials//EN"];
  const icsEsc = s => String(s).replace(/[\\,;]/g, m => "\\" + m).replace(/\n/g, "\\n");
  for (const e of EVENTS) {
    if (e.approx) continue;
    lines.push("BEGIN:VEVENT",
      `UID:${e.day}-${e.start}-${encodeURIComponent(e.url)}@corl2026-socials`,
      `DTSTAMP:${stamp(new Date())}`,
      `DTSTART:${stamp(toDate(e.day, e.start))}`,
      `DTEND:${stamp(toDate(e.day, e.end))}`,
      `SUMMARY:${icsEsc(L(e.title))}`,
      `LOCATION:${icsEsc(L(e.place))}`,
      `DESCRIPTION:${icsEsc(L(e.host) + "\n" + t().label[e.status] + "\n" + e.url)}`,
      `URL:${e.url}`,
      "END:VEVENT");
  }
  lines.push("END:VCALENDAR");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([lines.join("\r\n")], { type: "text/calendar" }));
  a.download = "corl2026-socials.ics";
  a.click();
  URL.revokeObjectURL(a.href);
});

document.querySelectorAll(".switcher button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".switcher button").forEach(b => b.setAttribute("aria-pressed", "false"));
    btn.setAttribute("aria-pressed", "true");
    filter = btn.dataset.f;
    render();
  });
});
applyLang();
</script>
</body>
</html>
